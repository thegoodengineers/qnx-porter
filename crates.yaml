# Rust crates for `scripts/run_crates.py`: widely used crates (crates.io downloads in brackets, 12 Nov 2026),
# pinned to the version that was current that day. zstd wraps the zstd C library through build.rs.
arch: x86_64
target: root@172.31.1.11
target_dir: /data/qnx-porter
crates:
  - {name: memchr, version: 2.8.3}             # [1.73 B]
  - {name: itoa, version: 1.0.19}              # [1.63 B]
  - {name: ryu, version: 1.0.23}               # [1.33 B]
  - {name: smallvec, version: 1.16.5}          # [1.45 B]
  - {name: bytes, version: 1.12.1}             # [1.27 B]
  - {name: hashbrown, version: 0.17.1}         # [3.06 B]
  - {name: serde_json, version: 1.0.154}       # [1.60 B]
  - {name: regex, version: 1.13.1}             # [1.38 B]
  - {name: crossbeam-channel, version: 0.5.17} # [0.70 B]
  - {name: parking_lot, version: 0.13.0}       # [1.27 B]
  - {name: rand, version: 0.10.3}              # [2.16 B]
  - {name: chrono, version: 0.4.45}            # [0.97 B]
  - {name: uuid, version: 1.29.2}              # [0.98 B]
  - {name: tempfile, version: 3.27.0}          # [0.99 B]
  - {name: walkdir, version: 2.5.0}            # [0.77 B]
  - {name: getrandom, version: 0.4.3}          # [2.58 B]
  - {name: socket2, version: 0.6.5}            # [1.48 B]
  - {name: libc, version: 0.2.191}             # [1.96 B]
  - {name: nix, version: 0.31.3}               # [0.97 B]
  - {name: mio, version: 1.2.4}                # [1.25 B]
  - {name: flate2, version: 1.1.11}            # [0.84 B]
  - {name: zstd, version: 0.14.3}              # [0.48 B]
