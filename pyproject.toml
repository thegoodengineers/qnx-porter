[project]
name = "qnx-porter"
version = "0.1.0"
description = "An agent that ports open-source C/C++ libraries to QNX 8.0 and proves each port with the library's own tests"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml>=5.4"]
campaign = ["pyyaml>=5.4"]

[project.scripts]
qnx-porter = "qnx_porter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qnx_porter"]

[tool.setuptools.package-data]
qnx_porter = ["brokenlib/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
