name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: CLI smoke test
        run: |
          qnx-porter --help
          qnx-porter detect qnx_porter/brokenlib | grep -x cmake
          qnx-porter selftest
      - name: No QNX numbers that a script did not produce
        run: |
          python scripts/ports_csv.py && git diff --exit-code results/ports.csv README.md
