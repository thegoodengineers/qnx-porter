name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cmake --version && cc --version  # both preinstalled on ubuntu-latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: No undefined names (code that only runs on a QNX target is not covered by the tests)
        run: |
          python -m pip install pyflakes==3.2.0
          python -m pyflakes qnx_porter scripts tests site paper video
      - name: CLI smoke test
        run: |
          qnx-porter --help
          qnx-porter detect qnx_porter/brokenlib | grep -x cmake
          qnx-porter selftest
      - name: No QNX numbers that a script did not produce
        run: |
          python scripts/ports_csv.py && git diff --exit-code results/ports.csv README.md
      - name: The website builds from the results
        run: |
          python -m pip install markdown==3.7
          python site/build.py
