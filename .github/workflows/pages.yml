name: site
on:
  push:
    branches: [main]
  workflow_run:  # refresh the weekly upstream page after each weekly run
    workflows: ["weekly upstream HEAD"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install markdown==3.7
      - name: Weekly upstream history from the data/head-history branch, if it exists
        run: |
          git fetch --depth=1 origin data/head-history || exit 0
          mkdir -p results/head
          git show FETCH_HEAD:results/head/history.csv > results/head/history.csv || rm -f results/head/history.csv
      - name: Build the site from results/ and ports/ (it cannot drift from them)
        run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
