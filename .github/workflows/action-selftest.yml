name: action
on:
  push:
    branches: [main]
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The action, as other projects would use it (self-test mode, no SDP on hosted runners)
        uses: ./
        with:
          selftest: "true"
